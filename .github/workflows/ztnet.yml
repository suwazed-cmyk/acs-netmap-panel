# Membangun paket ZTNET siap pakai lalu menerbitkannya sebagai rilis "ztnet-<versi>".
# VPS cukup mengunduh paket ini (tanpa npm install / build), jadi pemasangan ringan dan cepat.
# Versi baru: ubah ZTNET_VERSION di bawah (dan di pasang-ztnet.sh), atau jalankan manual dari tab Actions.
name: Paket ZTNET
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi ZTNET (tag), mis. v0.8.7"
        required: true
        default: "v0.8.7"
  push:
    branches: [main]
    paths:
      - "ztnet-build/**"
      - ".github/workflows/ztnet.yml"
permissions:
  contents: write
env:
  ZTNET_VERSION: v0.8.7
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          V="${{ github.event.inputs.version }}"; V="${V:-$ZTNET_VERSION}"
          echo "V=$V" >> "$GITHUB_ENV"
          bash ztnet-build/build.sh "$V"
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ztnet-$V"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ZTNET $V (paket siap pakai)" \
            --notes "Paket ZTNET $V hasil build, dipakai pasang-ztnet.sh / menu Add-on panel. Sumber: https://github.com/sinamics/ztnet/tree/$V (lisensi GPL-3.0)."
          gh release upload "$TAG" dist/* --clobber
